<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#191919">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect width="1120" height="900" fill="#ffffff"/>
<text x="30" y="34" font-size="18" font-weight="bold">The GRAM model: one Transformer, five parameter groups</text>
<rect x="30" y="50" width="16" height="16" rx="3" fill="#dbe9fb" stroke="#257de0"/><text x="54" y="63">core group, 26.3M parameters: embedding, unembedding, all attention, all normalisation, the core MLPs</text>
<rect x="30" y="74" width="16" height="16" rx="3" fill="#fde3d5" stroke="#f47230"/><text x="54" y="87">one group per topic, 1.6M parameters each: that topic's small MLP in each of the 8 blocks</text>

<text x="30" y="128" font-size="15" font-weight="bold">The whole model</text>
<text x="160" y="160" text-anchor="middle">token ids (128 sequences × 256 tokens)</text>
<path d="M160,168 L160,190" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<rect x="60" y="192" width="200" height="46" rx="6" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/>
<text x="160.0" y="212.0" text-anchor="middle" font-weight="bold">Embedding</text>
<text x="160.0" y="228.0" text-anchor="middle" font-size="11">4,096 tokens → 512 numbers each</text>
<path d="M160,238 L160,268" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<rect x="72" y="282" width="200" height="120" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.4"/>
<rect x="66" y="276" width="200" height="120" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.4"/>
<rect x="60" y="270" width="200" height="120" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.4"/>
<text x="160" y="322" text-anchor="middle" font-weight="bold">Block × 8</text><text x="160" y="340" text-anchor="middle" font-size="11">identical structure, separate weights</text><text x="160" y="356" text-anchor="middle" font-size="11">(one block is drawn on the right)</text>
<path d="M160,402 L160,430" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<rect x="60" y="432" width="200" height="36" rx="6" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/>
<text x="160.0" y="454.0" text-anchor="middle" font-weight="bold">Normalisation (RMSNorm)</text>
<path d="M160,468 L160,496" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<rect x="60" y="498" width="200" height="46" rx="6" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/>
<text x="160.0" y="518.0" text-anchor="middle" font-weight="bold">Unembedding</text>
<text x="160.0" y="534.0" text-anchor="middle" font-size="11">512 numbers → 4,096 token scores</text>
<path d="M160,544 L160,572" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<text x="160" y="590" text-anchor="middle">prediction of the next token,</text><text x="160" y="606" text-anchor="middle">at every position</text>
<path d="M272,330 L372,330" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)' stroke-dasharray='4 3'/>
<rect x="380" y="108" width="710" height="532" rx="10" fill="none" stroke="#666666" stroke-dasharray="6 4"/>
<text x="396" y="130" font-size="15" font-weight="bold">One block</text>
<text x="572" y="150" font-size="12">x: 512 numbers per token, from the previous block</text>
<path d="M560,140 L560,170" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<rect x="480" y="172" width="160" height="34" rx="6" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/>
<text x="560.0" y="193.0" text-anchor="middle" font-weight="bold">Normalisation</text>
<path d="M560,206 L560,226" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<rect x="480" y="228" width="160" height="50" rx="6" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/>
<text x="560.0" y="250.0" text-anchor="middle" font-weight="bold">Attention</text>
<text x="560.0" y="266.0" text-anchor="middle" font-size="11">8 heads</text>
<text x="652" y="248" font-size="11" fill="#666666">each token reads earlier tokens,</text><text x="652" y="263" font-size="11" fill="#666666">but only tokens of the same story</text>
<path d="M560,278 L560,299" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<circle cx="560" cy="313" r="13" fill="#ffffff" stroke="#666666" stroke-width="1.4"/><text x="560" y="318" text-anchor="middle" font-size="15">+</text>
<path d="M560,152 L430,152 L430,313 L546,313" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<text x="424" y="236" font-size="11" fill="#666666" text-anchor="end" transform="rotate(-90 424 236)">skip connection</text>
<path d="M560,326 L560,346" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<rect x="480" y="348" width="160" height="34" rx="6" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/>
<text x="560.0" y="369.0" text-anchor="middle" font-weight="bold">Normalisation</text>
<path d="M560,382 L560,404" fill="none" stroke="#666666" stroke-width="1.4"/>
<path d="M505,404 L991,404" fill="none" stroke="#666666" stroke-width="1.4"/>
<rect x="440" y="426" width="130" height="62" rx="6" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/>
<text x="505" y="454.0" text-anchor="middle" font-weight="bold">core MLP</text>
<text x="505" y="470.0" text-anchor="middle" font-size="11">512 → 2,048 → 512</text>
<rect x="593" y="426" width="106" height="62" rx="6" fill="#fde3d5" stroke="#f47230" stroke-width="1.5"/>
<text x="646.0" y="454.0" text-anchor="middle" font-weight="bold">module</text>
<text x="646.0" y="470.0" text-anchor="middle" font-size="11">512 → 192 → 512</text>
<text x="646" y="504" text-anchor="middle" font-size="11">a deadline</text>
<rect x="708" y="426" width="106" height="62" rx="6" fill="#fde3d5" stroke="#f47230" stroke-width="1.5"/>
<text x="761.0" y="454.0" text-anchor="middle" font-weight="bold">module</text>
<text x="761.0" y="470.0" text-anchor="middle" font-size="11">512 → 192 → 512</text>
<text x="761" y="504" text-anchor="middle" font-size="11">alien encounters</text>
<rect x="823" y="426" width="106" height="62" rx="6" fill="#fde3d5" stroke="#f47230" stroke-width="1.5"/>
<text x="876.0" y="454.0" text-anchor="middle" font-weight="bold">module</text>
<text x="876.0" y="470.0" text-anchor="middle" font-size="11">512 → 192 → 512</text>
<text x="876" y="504" text-anchor="middle" font-size="11">bygone eras</text>
<rect x="938" y="426" width="106" height="62" rx="6" fill="#fde3d5" stroke="#f47230" stroke-width="1.5"/>
<text x="991.0" y="454.0" text-anchor="middle" font-weight="bold">module</text>
<text x="991.0" y="470.0" text-anchor="middle" font-size="11">512 → 192 → 512</text>
<text x="991" y="504" text-anchor="middle" font-size="11">cultural traditions</text>
<path d="M505,404 L505,424" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<path d="M646,404 L646,424" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)' stroke-dasharray='4 3'/>
<path d="M761,404 L761,424" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)' stroke-dasharray='4 3'/>
<path d="M876,404 L876,424" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)' stroke-dasharray='4 3'/>
<path d="M991,404 L991,424" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)' stroke-dasharray='4 3'/>
<path d="M505,488 L505,528" fill="none" stroke="#666666" stroke-width="1.4"/>
<path d="M646,510 L646,528" fill="none" stroke="#666666" stroke-width="1.4" stroke-dasharray='4 3'/>
<path d="M761,510 L761,528" fill="none" stroke="#666666" stroke-width="1.4" stroke-dasharray='4 3'/>
<path d="M876,510 L876,528" fill="none" stroke="#666666" stroke-width="1.4" stroke-dasharray='4 3'/>
<path d="M991,510 L991,528" fill="none" stroke="#666666" stroke-width="1.4" stroke-dasharray='4 3'/>
<path d="M505,528 L991,528" fill="none" stroke="#666666" stroke-width="1.4"/>
<path d="M560,528 L560,541" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<circle cx="560" cy="555" r="13" fill="#ffffff" stroke="#666666" stroke-width="1.4"/><text x="560" y="560" text-anchor="middle" font-size="15">Σ</text>
<text x="582" y="552" font-size="12">sum of the outputs of the <tspan font-weight="bold">active</tspan> MLPs.</text><text x="582" y="568" font-size="12">A module that is not active is not run and adds nothing.</text>
<path d="M560,568 L560,584" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<circle cx="560" cy="598" r="13" fill="#ffffff" stroke="#666666" stroke-width="1.4"/><text x="560" y="603" text-anchor="middle" font-size="15">+</text>
<path d="M560,336 L430,336 L430,598 L546,598" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<text x="424" y="486" font-size="11" fill="#666666" text-anchor="end" transform="rotate(-90 424 486)">skip connection</text>
<path d="M560,611 L560,660" fill="none" stroke="#666666" stroke-width="1.4" marker-end='url(#a)'/>
<text x="572" y="656" font-size="12">to the next block</text>
<text x="30" y="688" font-size="15" font-weight="bold">What each kind of batch switches on, and what it is allowed to change</text>
<text x="30" y="714" font-weight="bold" font-size="12">batch</text>
<text x="330" y="714" font-weight="bold" font-size="12">share of its kind</text>
<text x="520" y="714" font-weight="bold" font-size="12">core group</text>
<text x="720" y="714" font-weight="bold" font-size="12">module of topic i</text>
<text x="920" y="714" font-weight="bold" font-size="12">the other 3 modules</text>
<line x1="30" y1="722" x2="1090" y2="722" stroke="#666666" stroke-width="1"/>
<text x="30" y="746" font-size="12">core story, plain</text><text x="330" y="746" font-size="12">50% of core batches</text>
<rect x="520" y="733" width="150" height="18" rx="9" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/><text x="595" y="746" text-anchor="middle" font-size="12" font-weight="bold">runs and learns</text>
<text x="720" y="746" fill="#666666" font-size="12">off (not run)</text>
<text x="920" y="746" fill="#666666" font-size="12">off (not run)</text>
<text x="30" y="774" font-size="12">core story, robust (i picked at random)</text><text x="330" y="774" font-size="12">50% of core batches</text>
<rect x="520" y="761" width="150" height="18" rx="9" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/><text x="595" y="774" text-anchor="middle" font-size="12" font-weight="bold">runs and learns</text>
<rect x="720" y="761" width="150" height="18" rx="9" fill="#fde3d5" stroke="#f47230" stroke-width="1.5"/><text x="795" y="774" text-anchor="middle" font-size="12" font-weight="bold">runs and learns</text>
<text x="920" y="774" fill="#666666" font-size="12">off (not run)</text>
<text x="30" y="802" font-size="12">topic-i story, isolated</text><text x="330" y="802" font-size="12">70% of topic-i batches</text>
<rect x="520" y="789" width="150" height="18" rx="9" fill="#ffffff" stroke="#257de0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="595" y="802" text-anchor="middle" font-size="12">runs, frozen</text>
<rect x="720" y="789" width="150" height="18" rx="9" fill="#fde3d5" stroke="#f47230" stroke-width="1.5"/><text x="795" y="802" text-anchor="middle" font-size="12" font-weight="bold">runs and learns</text>
<text x="920" y="802" fill="#666666" font-size="12">off (not run)</text>
<text x="30" y="830" font-size="12">topic-i story, spread</text><text x="330" y="830" font-size="12">30% of topic-i batches</text>
<rect x="520" y="817" width="150" height="18" rx="9" fill="#dbe9fb" stroke="#257de0" stroke-width="1.5"/><text x="595" y="830" text-anchor="middle" font-size="12" font-weight="bold">runs and learns</text>
<rect x="720" y="817" width="150" height="18" rx="9" fill="#fde3d5" stroke="#f47230" stroke-width="1.5"/><text x="795" y="830" text-anchor="middle" font-size="12" font-weight="bold">runs and learns</text>
<text x="920" y="830" fill="#666666" font-size="12">off (not run)</text>
