name: filtering_seed1
method: filtering
seed: 1
output_dir: runs/paper_exact
device: auto
data:
  store_dir: data/simplestories
  aux_topics:
  - a-deadline-or-time-limit
  - alien-encounters
  - bygone-eras
  - cultural-traditions
  train_fraction: 1.0
  val_fraction: 1.0
  cap_topics_at_class_mean: false
  batch_assembly: single_topic
labels:
  labeled_fraction: 1.0
  noise: none
  noise_rate: 0.0
model:
  vocab_size: 4096
  context_length: 256
  n_layers: 8
  n_heads: 8
  n_kv_heads: 2
  d_model: 512
  eos_token_id: 1
  dense_mlp_dim: 2048
  core_mlp_dim: 1856
  aux_mlp_dim: 192
routing:
  p_cr: 0.5
  p_as: 0.3
  p_af: 1.0
  equal_compute: false
optim:
  lr: 0.005
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  warmup_fraction: 0.1
  decay_fraction: 0.1
  grad_clip: 1.0
  batch_size: 128
  micro_batch_size: 128
  precision: bf16
  compile: true
eval:
  batch_size: 256
  curve_points: 0
  curve_core_batches: 50
elicit:
  enabled: true
  lr_factor: 0.25
  protocols:
  - name: code
    num_sequences: 512
    max_steps: 200
    patience: 10
  - name: paper
    num_sequences: 128
    max_steps: 75
    patience: 0
checkpoints:
  num_spaced: 10
  resume_every_steps: 500
probes:
  enabled: true
  num_points: 20
  chunk_size: 32
